
name: Update VPN Gate Servers

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Update VPN Gate servers
        run: |
          python scripts/update_vpngate.py

      - name: Validate generated files
        run: |
          test -s data/servers.csv
          test -s data/servers.json
          test -d data/profiles

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/servers.csv
          git add data/servers.json
          git add data/profiles/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update VPN Gate servers"
            git push
          fi
